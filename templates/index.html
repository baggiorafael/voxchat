<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>VoxChat — Chat, Voz e Vídeo</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

<!-- TELA DE ENTRADA -->
<div id="login-screen" class="screen">
  <div class="login-card">
    <h1>🎙️ VoxChat</h1>
    <p class="subtitle">Chat de texto, voz, vídeo e compartilhamento de tela em tempo real</p>
    <input id="name-input" type="text" placeholder="Seu nome" maxlength="32" autocomplete="off">
    <p class="field-label">Servidor</p>
    <div id="server-picker" class="server-picker"></div>
    <input id="password-input" type="password" placeholder="Senha da sala" maxlength="64" autocomplete="off" inputmode="numeric">
    <p id="login-error" class="login-error hidden"></p>
    <button id="join-btn">Entrar na sala</button>
    <p class="hint">Permita o acesso ao microfone/câmera quando solicitado.</p>
  </div>
</div>

<!-- APP PRINCIPAL -->
<div id="app-screen" class="screen hidden">
  <div class="app-layout">

    <!-- BARRA DE SERVIDORES -->
    <nav id="server-rail" class="server-rail"></nav>

    <!-- SIDEBAR -->
    <aside class="sidebar">
      <div class="room-header">
        <span id="room-name-label">#geral</span>
      </div>
      <div class="members-section">
        <h3>Conectados — <span id="member-count">0</span></h3>
        <ul id="member-list"></ul>
      </div>
      <div class="controls">
        <button id="mic-btn" class="ctrl-btn active" title="Microfone">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 3 3Z" fill="currentColor"/>
            <path d="M19 11a7 7 0 0 1-14 0M12 18v3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
          <svg class="icon-off" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v6a3 3 0 0 0 .32 1.36" fill="currentColor"/>
            <path d="M19 11a7 7 0 0 1-14 0M12 18v3" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
            <path d="M3 3l18 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </button>
        <button id="cam-btn" class="ctrl-btn" title="Câmera">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="2" y="6" width="14" height="12" rx="2" fill="currentColor"/>
            <path d="M16 10.5 21.4 7a1 1 0 0 1 1.6.8v8.4a1 1 0 0 1-1.6.8L16 13.5v-3Z" fill="currentColor"/>
          </svg>
          <svg class="icon-off" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="2" y="6" width="14" height="12" rx="2" fill="currentColor"/>
            <path d="M16 10.5 21.4 7a1 1 0 0 1 1.6.8v8.4a1 1 0 0 1-1.6.8L16 13.5v-3Z" fill="currentColor"/>
            <path d="M3 3l18 18" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </button>
        <button id="screen-btn" class="ctrl-btn" title="Compartilhar tela">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <rect x="2" y="4" width="20" height="13" rx="2" stroke="currentColor" stroke-width="2"/>
            <path d="M8 21h8M12 17v4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </button>
        <button id="sounds-btn" class="ctrl-btn" title="Sons">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M4 15h1.6a3 3 0 0 0 1.9-.7L12 10v14l-4.5-4.3a3 3 0 0 0-1.9-.7H4a1 1 0 0 1-1-1v-2a1 1 0 0 1 1-1Z" fill="currentColor"/>
            <path d="M17 8.5c1 1 1.5 2.2 1.5 3.5s-.5 2.5-1.5 3.5M20 5.5c2 2 3 4.3 3 6.5s-1 4.5-3 6.5" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
        </button>
        <button id="leave-btn" class="ctrl-btn danger" title="Sair">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <path d="M3.6 3.6 20.4 20.4M3 10c3-2.6 6-4 9-4 1.2 0 2.4.2 3.6.6M21 10c-.9-.8-1.9-1.5-2.9-2M8.3 13c-2 .9-3.7 2.2-5.3 4.2a1.4 1.4 0 0 0 .2 2l1.9 1.5a1.4 1.4 0 0 0 1.9-.2c.6-.7 1.2-1.3 1.8-1.7a1.3 1.3 0 0 0 .5-1.4l-.6-2.2M15.5 11.7l2.1.7a1.3 1.3 0 0 1 .9 1.2c0 .8-.1 1.6-.3 2.4a1.4 1.4 0 0 0 .5 1.5l1.9 1.5a1.4 1.4 0 0 0 2-.3c1.7-2.4 2.4-4.7 2.4-6.7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>

        <div id="soundboard-panel" class="soundboard-panel hidden"></div>
      </div>
    </aside>

    <!-- MAIN -->
    <main class="main-area">
      <div class="video-grid" id="video-grid"></div>

      <div class="chat-panel">
        <div class="chat-messages" id="chat-messages"></div>
        <form id="chat-form" autocomplete="off">
          <input id="chat-input" type="text" placeholder="Enviar mensagem..." maxlength="1000">
          <button type="submit">Enviar</button>
        </form>
      </div>
    </main>

  </div>
</div>

<script src="https://cdn.socket.io/4.7.5/socket.io.min.js"></script>
<script src="{{ url_for('static', filename='app.js') }}"></script>
</body>
</html>
